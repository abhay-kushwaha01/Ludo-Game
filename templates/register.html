{% extends "base.html" %}
{% block title %}Register - Ludo Master{% endblock %}
{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: calc(100vh - 200px); padding: 2rem 0;">
    <div class="row w-100" style="max-width: 500px;">
        <div class="col-12">
            <div class="card shadow-lg border-0" style="background: rgba(255,255,255,0.95); backdrop-filter: blur(10px);">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="fas fa-user-plus" style="font-size: 3rem; color: var(--secondary-color);"></i>
                        <h2 class="mt-3 fw-bold">Create Account</h2>
                        <p class="text-muted">Join the Ludo Master Community</p>
                    </div>

                    <form method="POST" action="{{ url_for('auth.register') }}" novalidate>
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <div class="input-group">
                                <span class="input-group-text" style="border: 2px solid #e5e7eb; background: white;">
                                    <i class="fas fa-user" style="color: var(--secondary-color);"></i>
                                </span>
                                <input type="text" class="form-control" id="username" name="username" placeholder="Choose a unique username" required autofocus>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text" style="border: 2px solid #e5e7eb; background: white;">
                                    <i class="fas fa-envelope" style="color: var(--secondary-color);"></i>
                                </span>
                                <input type="email" class="form-control" id="email" name="email" placeholder="your@email.com" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text" style="border: 2px solid #e5e7eb; background: white;">
                                    <i class="fas fa-lock" style="color: var(--secondary-color);"></i>
                                </span>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Create a strong password" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="terms" name="terms" required>
                                <label class="form-check-label" for="terms">
                                    I agree to Terms of Service and Privacy Policy
                                </label>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-3 mb-3" style="font-weight: 700; font-size: 1.1rem;">
                            <i class="fas fa-user-plus"></i> Create Account
                        </button>

                        <hr style="border-color: #e5e7eb;">

                        <p class="text-center text-muted mb-0">
                            Already have an account? 
                            <a href="{{ url_for('auth.login') }}" style="color: var(--secondary-color); text-decoration: none; font-weight: 600;">
                                Login here
                            </a>
                        </p>
                    </form>
                </div>
            </div>

            <div class="mt-4 text-center text-white">
                <p style="font-size: 0.9rem;">
                    <i class="fas fa-shield-alt"></i> Your data is secure and encrypted
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
